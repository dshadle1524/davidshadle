services:
  postgres:
    image: postgres:16
    container_name: davidshadle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: davidshadle
    ports:
      - "5732:5432"
    volumes:
      - davidshadle-pgdata:/var/lib/postgresql/data

volumes:
  davidshadle-pgdata:
