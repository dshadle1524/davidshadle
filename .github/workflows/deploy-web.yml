name: Deploy web to Control Plane

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cpln CLI
        run: npm install -g cpln

      - name: Docker login to Control Plane registry
        run: cpln image docker-login --org second-on-left --token "${{ secrets.CPLN_TOKEN }}"

      - name: Build and push image
        working-directory: web
        run: |
          TAG="${GITHUB_SHA::7}"
          cpln image build \
            --name "davidshadle:${TAG}" \
            --dockerfile Dockerfile \
            --dir . \
            --push \
            --org second-on-left \
            --token "${{ secrets.CPLN_TOKEN }}"

      - name: Point workload at the new image
        run: |
          TAG="${GITHUB_SHA::7}"
          cpln workload update web \
            --gvc davidshadle \
            --org second-on-left \
            --set spec.containers.web.image="/org/second-on-left/image/davidshadle:${TAG}" \
            --token "${{ secrets.CPLN_TOKEN }}"
